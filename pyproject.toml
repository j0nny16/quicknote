[project]
name = "quicknotes"
version = "0.1.0"
description = "Voice/text quick notes from chat apps into Anytype (and friends)"
readme = "README.md"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["anytype", "telegram", "whisper", "notes", "transcription", "self-hosted"]
classifiers = [
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Office/Business :: News/Diary",
]

dependencies = [
    "python-telegram-bot>=21.6",
    "anthropic>=0.40",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.urls]
Homepage = "https://github.com/j0nny16/quicknote"
Issues = "https://github.com/j0nny16/quicknote/issues"

[project.scripts]
quicknotes = "quicknotes.__main__:cli"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
